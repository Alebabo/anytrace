  <line x1="20" y1="30" x2="44" y2="28" stroke="white" stroke-width="1.4" stroke-opacity="0.35"/>
  <line x1="28" y1="44" x2="38" y2="44" stroke="white" stroke-width="1.4" stroke-opacity="0.35"/>
  <line x1="12" y1="22" x2="20" y2="30" stroke="white" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="44" y1="28" x2="52" y2="20" stroke="white" stroke-width="1.2" stroke-opacity="0.3"/>
